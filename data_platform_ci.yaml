name: Financial ELT CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest apache-airflow dbt-core dbt-postgres yfinance pandas

      # 1. Linting Python (Ruff)
      - name: Run Ruff Linter
        run: |
          ruff check .

      # 2. Test integrità DAG di Airflow
      - name: Test Airflow DAG parsing
        run: |
          export AIRFLOW_HOME=${{ github.workspace }}/airflow-project
          python -m pytest airflow-project/tests/test_dag_integrity.py

      # 3. Compilazione e validazione dbt
      - name: Check dbt compilation
        run: |
          cd financial-analytics
          dbt parse