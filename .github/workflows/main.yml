name: Financial ELT CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: airflow-project/requirements.txt

      - name: Set Airflow Home Environment
        run: echo "AIRFLOW_HOME=${{ github.workspace }}/airflow-project" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          AIRFLOW_VERSION="2.10.2"
          PYTHON_VERSION="3.10"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

          if [ -f "airflow-project/requirements.txt" ]; then
            pip install -r airflow-project/requirements.txt
          fi
          pip install ruff pytest dbt-core dbt-postgres

      # 1. Linting Python (Ruff)
      - name: Run Ruff Linter
        run: |
          ruff check .

      # 2. Test integrity of Airflow DAGs
      - name: Test Airflow DAG parsing
        run: |
          airflow db migrate
          pytest airflow-project/tests/test_dag_integrity.py

      # 3. Compile and validate dbt models
      - name: Run dbt parse
        run: |
          cd financial_analytics
          dbt parse --profiles-dir .
