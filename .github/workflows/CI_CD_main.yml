name: Financial ELT CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: Continuous Integration (CI)
  # ==========================================
  validate-pipeline:
    name: CI - Lint, Test & Parse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: airflow-project/requirements.txt

      - name: Set Airflow Home Environment
        run: echo "AIRFLOW_HOME=${{ github.workspace }}/airflow-project" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          AIRFLOW_VERSION="2.10.2"
          PYTHON_VERSION="3.10"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

          if [ -f "airflow-project/requirements.txt" ]; then
            pip install -r airflow-project/requirements.txt
          fi
          pip install ruff pytest dbt-core dbt-postgres

      # 1. Linting Python (Ruff)
      - name: Run Ruff Linter
        run: |
          ruff check .

      # 2. Test integrity of Airflow DAGs
      - name: Test Airflow DAG parsing
        run: |
          airflow db migrate
          pytest airflow-project/tests/test_dag_integrity.py

      # 3. Compile and validate dbt models
      - name: Run dbt parse
        run: |
          cd financial_analytics
          dbt parse --profiles-dir .

  # ==========================================
  # JOB 2: Continuous Deployment (CD)
  # ==========================================
  deploy-docker:
    name: CD - Build & Push Docker Image
    needs: validate-pipeline
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./airflow-project
          file: ./airflow-project/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
